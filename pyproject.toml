[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eligo"
version = "1.0.0"
description = "Sistem Pemeringkatan Siswa Eligible SNBP (Eligo) Berdasarkan Regulasi Kemendikbudristek"
authors = [
    { name = "Eligo Development Team" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "TID",  # flake8-tidy-imports
]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Batasan C1 & C3: Lapisan domain dilarang mengimpor rich atau pustaka I/O pihak ketiga
"rich".msg = "Lapisan domain murni dilarang mengimpor rich. Rich hanya diizinkan di presentation/cli/ (C1)."

[tool.ruff.lint.per-file-ignores]
# Izinkan rich di luar domain (misalnya presentation, tests, generator)
"!eligo/domain/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "eligo.domain.*"
strict = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "Windows"
include = ["eligo", "generator", "tests", "main.py"]
extraPaths = [
    ".venv/Lib/site-packages",
    "."
]
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "none"
typeCheckingMode = "off"

